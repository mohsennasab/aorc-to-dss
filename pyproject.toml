[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aorctodss-service"
version = "0.1.8"
description = "Local AORC and HEC-DSS processing service for GeoLibre"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
  "affine>=2.4,<3",
  "dask[array]>=2024.10",
  "geopandas>=1.0,<2",
  "hecdss>=0.1.29,<0.2",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17,<22",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "s3fs>=2025.1",
  "shapely>=2.0,<3",
  "xarray>=2024.10",
  "zarr>=2.18,<3"
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "responses>=0.25"]
packaging = ["pyinstaller>=6.10"]

[project.scripts]
aorctodss-service = "aorctodss_service.__main__:main"

[tool.setuptools]
package-dir = {"" = "service"}

[tool.setuptools.packages.find]
where = ["service"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
pythonpath = ["service"]
markers = [
  "integration: accesses the NOAA archive",
  "dss: requires the official hecdss native library"
]
addopts = "-ra"
